[project]
name = "grimoire-mcp"
version = "0.1.0"
description = "Standalone MCP server for RAG over project wiki folders (LlamaIndex + BM25). Part of the Grimoire agent project library."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.12",
    "llama-index-retrievers-bm25>=0.1",
    "mcp>=1.29,<2",
    "starlette>=0.27,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
grimoire-mcp = "wiki_rag.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_rag"]
