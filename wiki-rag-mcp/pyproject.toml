[project]
name = "wiki-rag-mcp"
version = "0.1.0"
description = "Standalone MCP server for RAG over project wiki folders (LlamaIndex + BM25). Plug-and-play into any agent harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.12",
    "llama-index-retrievers-bm25>=0.1",
    "mcp>=1.0",
]

[project.scripts]
wiki-rag-mcp = "wiki_rag.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_rag"]
